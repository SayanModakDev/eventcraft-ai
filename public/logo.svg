<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <!-- Emblem Background Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="emblemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Primary Crystal Facet Gradient -->
    <linearGradient id="facetPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Secondary Crystal Facet Gradient -->
    <linearGradient id="facetSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="60%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Golden Spark Gradient -->
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Wordmark Craft Gradient -->
    <linearGradient id="craftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- AI Tag Badge Gradient -->
    <linearGradient id="aiBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="aiBadgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- 1. Emblem Group (Left: x=8, y=8, w=64, h=64) -->
  <g transform="translate(8, 8)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#emblemBg)" stroke="url(#emblemBorder)" stroke-width="1.8" />

    <!-- Ambient Glow -->
    <circle cx="32" cy="32" r="18" fill="#7C3AED" opacity="0.3" />

    <!-- Geometric Facets scaled to 64x64 -->
    <!-- Center is (32, 32) -->
    <!-- Left Facet -->
    <path d="M 32 14 L 17 25 L 22 42 L 32 50 L 32 32 Z" fill="url(#facetPrimary)" opacity="0.95" />
    <!-- Right Facet -->
    <path d="M 32 14 L 47 25 L 42 42 L 32 50 L 32 32 Z" fill="url(#facetSecondary)" opacity="0.95" />
    <!-- Top Highlight -->
    <path d="M 32 14 L 25 20 L 32 25 L 39 20 Z" fill="#C084FC" opacity="0.9" />

    <!-- Celebration Micro Confetti -->
    <circle cx="15" cy="18" r="1.5" fill="#FBBF24" />
    <circle cx="49" cy="18" r="1.5" fill="#38BDF8" />
    <circle cx="18" cy="48" r="1.2" fill="#34D399" />
    <circle cx="46" cy="48" r="1.2" fill="#F59E0B" />

    <!-- Central AI Spark -->
    <path d="M 32 20 Q 32 32 44 32 Q 32 32 32 44 Q 32 32 20 32 Q 32 32 32 20 Z" fill="url(#sparkGold)" />
    <polygon points="32,26 37,32 32,38 27,32" fill="#FFFFFF" opacity="0.9" />
    <circle cx="32" cy="32" r="1.8" fill="#FEF08A" />
  </g>

  <!-- 2. Typography Wordmark -->
  <!-- "Event" in clean solid white / deep dark slate depending on theme -->
  <text x="86" y="49" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
    Event<tspan fill="url(#craftGradient)">Craft</tspan>
  </text>

  <!-- 3. AI Pill Tag -->
  <g transform="translate(242, 28)">
    <!-- Pill Container -->
    <rect x="0" y="0" width="38" height="22" rx="11" fill="url(#aiBadgeBg)" stroke="url(#aiBadgeBorder)" stroke-width="1.2" />
    <!-- Spark Dot -->
    <circle cx="9" cy="11" r="2.2" fill="#F59E0B" />
    <!-- "AI" Text -->
    <text x="16" y="15.5" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.05em" fill="#F59E0B">
      AI
    </text>
  </g>

  <!-- Subtitle Tagline below wordmark (Desktop display) -->
  <text x="88" y="65" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.12em" fill="#94A3B8" text-transform="uppercase">
    Celebration &amp; Event Planner
  </text>
</svg>
