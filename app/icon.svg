    <path d="M 256 100 L 198 144 L 256 188 L 314 144 Z" fill="url(#highlightFacet)" />
    <path d="M 175 320 L 256 380 L 256 420 L 155 350 Z" fill="#3730A3" opacity="0.8" />
    <path d="M 337 320 L 256 380 L 256 420 L 357 350 Z" fill="#581C87" opacity="0.8" />

    <circle cx="120" cy="140" r="7" fill="#FBBF24" />
